# Entriqa-Release: Tag v* pushen (z. B. v1.0.0) → Tests laufen, API und Admin werden gebaut
# und als ZIPs an ein GitHub-Release gehängt. Genau diese ZIPs referenziert docs/QUICKSTART.md.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Tests
        run: dotnet test api -c Release

      - name: API publizieren
        run: |
          dotnet publish api/src/Entriqa.Functions -c Release -o out/api
          cd out/api && zip -r ../../entriqa-api-${GITHUB_REF_NAME}.zip .

      - name: Admin publizieren
        run: |
          dotnet publish admin/Entriqa.Admin -c Release -o out/admin
          # Produktion liegt unter /admin/ – base-href ersetzen (siehe docs/QUICKSTART.md)
          sed -i 's|<base href="/" />|<base href="/admin/" />|' out/admin/wwwroot/index.html
          grep -q '<base href="/admin/" />' out/admin/wwwroot/index.html
          rm -f out/admin/wwwroot/index.html.br out/admin/wwwroot/index.html.gz
          cd out/admin/wwwroot && zip -r ../../../entriqa-admin-${GITHUB_REF_NAME}.zip .

      - name: Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "entriqa-api-${GITHUB_REF_NAME}.zip" \
            "entriqa-admin-${GITHUB_REF_NAME}.zip" \
            --title "Entriqa $GITHUB_REF_NAME" \
            --generate-notes
