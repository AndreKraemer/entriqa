# Entriqa release: push a v* tag (e.g. v1.0.0) - the solution is built and tested, API and admin
# are published and attached to a GitHub release as ZIPs. docs/QUICKSTART.md points at exactly these.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build and test
        # Build the solution first, the same way scripts/verify.mjs does: `dotnet test` alone
        # only builds what the test project needs, so a broken admin would reach the publish step.
        run: |
          dotnet build Entriqa.slnx -c Release
          dotnet test Entriqa.slnx -c Release --no-build

      - name: Publish the API
        run: |
          dotnet publish src/Hosts/Entriqa.Functions -c Release -o out/api
          cd out/api && zip -r ../../entriqa-api-${GITHUB_REF_NAME}.zip .

      - name: Publish the admin
        run: |
          dotnet publish src/Ui/Entriqa.Admin -c Release -o out/admin
          # Production is served under /admin/ - rewrite the base href (see docs/QUICKSTART.md)
          sed -i 's|<base href="/" />|<base href="/admin/" />|' out/admin/wwwroot/index.html
          grep -q '<base href="/admin/" />' out/admin/wwwroot/index.html
          rm -f out/admin/wwwroot/index.html.br out/admin/wwwroot/index.html.gz
          cd out/admin/wwwroot && zip -r ../../../entriqa-admin-${GITHUB_REF_NAME}.zip .

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "entriqa-api-${GITHUB_REF_NAME}.zip" \
            "entriqa-admin-${GITHUB_REF_NAME}.zip" \
            --title "Entriqa $GITHUB_REF_NAME" \
            --generate-notes
