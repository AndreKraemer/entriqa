{{- /*
  Bettet ein Formular des Formularsystems ein.
  Aufruf: {{< form "slug" >}}  oder  {{< form slug="slug" >}}
  Dünner Wrapper um partials/forms/embed.html (dasselbe für Layouts).
*/ -}}
{{- $slug := .Get "slug" | default (.Get 0) -}}
{{- partial "forms/embed" (dict "slug" $slug "page" .Page) -}}
